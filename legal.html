es: {
  titulo:'Información legal', volver:'Volver al inicio', act:'Última actualización',
  t_af:'Aviso de afiliados',
  c_af:`<p>Esta web es un <b>buscador y comparador de viajes</b>, no una agencia de viajes. No vendemos vuelos, hoteles ni paquetes turísticos, no gestionamos cobros y no somos parte del contrato que firmas al reservar.</p>
        <p>Cuando pulsas un botón de búsqueda o de reserva te enviamos a la web de un tercero (Booking.com, Aviasales/Skyscanner, GetYourGuide, Civitatis, EconomyBookings, Airalo u otros). Si contratas allí, ese proveedor nos paga una <b>comisión de afiliado</b>. <b>Tú pagas exactamente el mismo precio</b>: la comisión sale del margen del proveedor, no de tu bolsillo.</p>
        <p>Los precios que ves aquí son <b>orientativos</b>, calculados sobre valores habituales, y pueden no coincidir con el precio final. El precio válido es siempre el que muestre el proveedor en el momento de la reserva.</p>
        <p>Cualquier incidencia con una reserva (cambios, cancelaciones, reembolsos) debe tratarse directamente con el proveedor que te la vendió, que es quien tiene tu contrato y tu dinero.</p>`,
  t_pr:'Política de privacidad',
  c_pr:`<p>Responsable: [TUS DATOS: nombre o razón social, NIF y dirección] · Contacto: <span class="mail"></span></p>
        <p><b>Qué datos recogemos.</b> Esta web funciona sin cuentas de usuario. Los datos que introduces en el buscador (destino, fechas, número de viajeros) se usan solo para construir el enlace de búsqueda y no se almacenan en ningún servidor nuestro.</p>
        <p>Si nos escribes por el formulario de contacto, tu mensaje se abre en tu propio programa de correo: recibimos tu nombre, tu correo y lo que nos cuentes, y lo usamos únicamente para responderte.</p>
        <p>Si te suscribes al boletín, guardamos tu correo con la única finalidad de enviarte ofertas. Puedes darte de baja en cualquier momento desde el enlace de cada envío.</p>
        <p><b>Dónde se guardan tus preferencias.</b> Idioma, moneda, tema, favoritos y la lista de equipaje se guardan <b>en tu propio navegador</b> (almacenamiento local). No salen de tu dispositivo y puedes borrarlas vaciando los datos del sitio.</p>
        <p><b>Terceros.</b> Al pulsar un enlace de reserva pasas a la web del proveedor, con su propia política de privacidad. Ellos pueden registrar que llegaste desde aquí para atribuir la comisión.</p>
        <p><b>Tus derechos.</b> Puedes solicitar acceso, rectificación, supresión, oposición, limitación y portabilidad de tus datos escribiéndonos. También puedes reclamar ante la autoridad de protección de datos de tu país.</p>`,
  t_co:'Política de cookies',
  c_co:`<p>Esta web <b>no instala cookies propias de publicidad ni de analítica</b>. Tus preferencias (idioma, moneda, tema, favoritos y lista de equipaje) se guardan en el almacenamiento local del navegador, no en cookies, y no salen de tu dispositivo.</p>
        <p><b>Cookies de terceros.</b> Cargamos el script de <b>Travelpayouts</b>, nuestra red de afiliados, que puede instalar cookies de terceros con una única finalidad: reconocer que la reserva salió de aquí y atribuirnos la comisión. No se usan para publicidad personalizada ni para elaborar un perfil tuyo. El script se descarga desde <code>emrldtp.com</code>.</p>
        <p>Los proveedores a los que te enviamos (Booking, Skyscanner, GetYourGuide…) usan además sus propias cookies. Eso ocurre ya en su web y se rige por su política.</p>
        <p><b>Cómo evitarlas.</b> Puedes bloquear las cookies de terceros en los ajustes de tu navegador o navegar en modo privado: la web funcionará exactamente igual, simplemente no cobraremos comisión. Para borrar lo que guardamos, vacía los «datos de sitios web» de tu navegador.</p>`,
  t_te:'Términos de uso',
  c_te:`<p>Al usar esta web aceptas estas condiciones. El servicio se ofrece «tal cual», de forma gratuita y sin garantía de disponibilidad ininterrumpida.</p>
        <p>La información sobre destinos, precios orientativos, mejores épocas e itinerarios tiene <b>carácter informativo</b>. Hacemos lo posible por mantenerla al día, pero no garantizamos su exactitud. Verifica siempre requisitos de entrada, visados y condiciones sanitarias en las fuentes oficiales de tu país y del país de destino antes de reservar.</p>
        <p>Los itinerarios propuestos son sugerencias de planificación, no un paquete turístico combinado en el sentido de la normativa aplicable: cada servicio se contrata por separado y con su proveedor.</p>
        <p>No nos hacemos responsables de las decisiones de viaje tomadas a partir de la información aquí publicada, ni del contenido, disponibilidad o condiciones de las webs de terceros enlazadas.</p>
        <p>Las marcas citadas pertenecen a sus respectivos titulares y se mencionan a título identificativo.</p>`
},
en: {
  titulo:'Legal information', volver:'Back to home', act:'Last updated',
  t_af:'Affiliate disclosure',
  c_af:`<p>This site is a <b>travel search and comparison tool</b>, not a travel agency. We do not sell flights, hotels or package holidays, we do not process payments and we are not a party to the contract you sign when you book.</p>
        <p>When you click a search or booking button we send you to a third-party site (Booking.com, Aviasales/Skyscanner, GetYourGuide, Civitatis, EconomyBookings, Airalo and others). If you book there, that provider pays us an <b>affiliate commission</b>. <b>You pay exactly the same price</b>: the commission comes out of the provider's margin, not your pocket.</p>
        <p>Prices shown here are <b>indicative</b>, based on typical values, and may differ from the final price. The valid price is always the one shown by the provider at the time of booking.</p>
        <p>Any issue with a booking (changes, cancellations, refunds) must be handled directly with the provider that sold it to you — they hold your contract and your money.</p>`,
  t_pr:'Privacy policy',
  c_pr:`<p>Controller: [YOUR DETAILS: name or company, tax ID and address] · Contact: <span class="mail"></span></p>
        <p><b>What we collect.</b> This site works without user accounts. What you type into the search box (destination, dates, number of travellers) is used only to build the search link and is not stored on any server of ours.</p>
        <p>If you write via the contact form, your message opens in your own email client: we receive your name, your email and your message, and use them only to reply.</p>
        <p>If you subscribe to the newsletter, we store your email for the sole purpose of sending you deals. You can unsubscribe at any time from the link in every email.</p>
        <p><b>Where your preferences live.</b> Language, currency, theme, favourites and packing list are stored <b>in your own browser</b> (local storage). They never leave your device and you can delete them by clearing site data.</p>
        <p><b>Third parties.</b> Clicking a booking link takes you to the provider's site, which has its own privacy policy. They may record that you arrived from here in order to attribute the commission.</p>
        <p><b>Your rights.</b> You may request access, rectification, erasure, objection, restriction and portability of your data by writing to us. You may also complain to your national data protection authority.</p>`,
  t_co:'Cookie policy',
  c_co:`<p>This site sets <b>no first-party advertising or analytics cookies</b>. Your preferences (language, currency, theme, favourites and packing list) are kept in your browser's local storage, not in cookies, and never leave your device.</p>
        <p><b>Third-party cookies.</b> We load the script of <b>Travelpayouts</b>, our affiliate network, which may set third-party cookies for one purpose only: to recognise that the booking started here and credit us the commission. They are not used for personalised advertising or to build a profile of you. The script is served from <code>emrldtp.com</code>.</p>
        <p>The providers we send you to (Booking, Skyscanner, GetYourGuide…) also use their own cookies. That happens on their site and is governed by their policy.</p>
        <p><b>How to avoid them.</b> You can block third-party cookies in your browser settings or browse in private mode: the site will work exactly the same, we simply won't earn a commission. To delete what we store, clear your browser's "site data".</p>`,
  t_te:'Terms of use',
  c_te:`<p>By using this site you accept these terms. The service is provided "as is", free of charge and with no guarantee of uninterrupted availability.</p>
        <p>Information about destinations, indicative prices, best seasons and itineraries is <b>for guidance only</b>. We do our best to keep it current but we do not guarantee its accuracy. Always verify entry requirements, visas and health conditions with the official sources of your country and your destination before booking.</p>
        <p>The itineraries we propose are planning suggestions, not a package holiday under applicable regulations: each service is contracted separately and with its own provider.</p>
        <p>We are not liable for travel decisions taken on the basis of the information published here, nor for the content, availability or terms of the third-party sites we link to.</p>
        <p>Trademarks mentioned belong to their respective owners and are used for identification purposes only.</p>`
},

  c_af:`<p>Diese Website ist eine <b>Reisesuchmaschine und ein Vergleichsportal</b>, kein Reisebüro. Wir verkaufen keine Flüge, Hotels oder Pauschalreisen, wickeln keine Zahlungen ab und sind nicht Vertragspartei deiner Buchung.</p>

  t_pr:'Datenschutzerklärung',
  c_pr:`<p>Verantwortlich: [DEINE DATEN: Name bzw. Firma, Steuernummer und Anschrift] · Kontakt: <span class="mail"></span></p>
        <p><b>Welche Daten wir erheben.</b> Diese Website funktioniert ohne Benutzerkonten. Deine Eingaben in der Suche (Ziel, Daten, Anzahl Reisender) dienen nur dem Aufbau des Suchlinks und werden auf keinem unserer Server gespeichert.</p>

  t_co:'Cookie-Richtlinie',
  c_co:`<p>Diese Website setzt <b>keine eigenen Werbe- oder Analyse-Cookies</b>. Deine Einstellungen (Sprache, Währung, Design, Favoriten, Packliste) liegen im lokalen Speicher deines Browsers, nicht in Cookies, und verlassen dein Gerät nicht.</p>

        <p>Die Anbieter, zu denen wir verlinken (Booking, Skyscanner, GetYourGuide…), setzen zusätzlich eigene Cookies. Das geschieht auf deren Seite und nach deren Richtlinie.</p>

  t_te:'Nutzungsbedingungen',
  c_te:`<p>Mit der Nutzung dieser Website akzeptierst du diese Bedingungen. Das Angebot erfolgt „wie besehen", kostenlos und ohne Garantie ununterbrochener Verfügbarkeit.</p>

        <p>Die vorgeschlagenen Routen sind Planungsvorschläge, keine Pauschalreise im Sinne der geltenden Vorschriften: Jede Leistung wird einzeln beim jeweiligen Anbieter gebucht.</p>
        <p>Für Reiseentscheidungen auf Basis dieser Informationen sowie für Inhalte, Verfügbarkeit und Konditionen verlinkter Drittseiten übernehmen wir keine Haftung.</p>

fr: {
  titulo:'Informations légales', volver:'Retour à l\'accueil', act:'Dernière mise à jour',
  t_af:'Divulgation d\'affiliation',
  c_af:`<p>Ce site est un <b>moteur de recherche et comparateur de voyages</b>, pas une agence de voyages. Nous ne vendons ni vols, ni hôtels, ni forfaits, nous ne gérons aucun paiement et nous ne sommes pas partie au contrat que vous signez en réservant.</p>

        <p>Les prix affichés ici sont <b>indicatifs</b>, calculés sur des valeurs habituelles, et peuvent différer du prix final. Le prix valable est toujours celui affiché par le prestataire au moment de la réservation.</p>

  t_pr:'Politique de confidentialité',
  c_pr:`<p>Responsable : [VOS DONNÉES : nom ou raison sociale, numéro fiscal et adresse] · Contact : <span class="mail"></span></p>

        <p>Si vous vous abonnez à la newsletter, nous conservons votre e-mail à seule fin de vous envoyer des offres. Désinscription à tout moment via le lien présent dans chaque envoi.</p>

  t_co:'Politique de cookies',
  c_co:`<p>Ce site ne dépose <b>aucun cookie publicitaire ni de mesure d'audience propre</b>. Vos préférences (langue, devise, thème, favoris, check-list) sont conservées dans le stockage local du navigateur, pas dans des cookies, et ne quittent pas votre appareil.</p>

it: {
  titulo:'Informazioni legali', volver:'Torna alla home', act:'Ultimo aggiornamento',
  t_af:'Informativa sull\'affiliazione',
  c_af:`<p>Questo sito è un <b>motore di ricerca e comparatore di viaggi</b>, non un\'agenzia di viaggi. Non vendiamo voli, hotel o pacchetti turistici, non gestiamo pagamenti e non siamo parte del contratto che sottoscrivi prenotando.</p>

  t_pr:'Informativa sulla privacy',
  c_pr:`<p>Titolare: [I TUOI DATI: nome o ragione sociale, partita IVA e indirizzo] · Contatto: <span class="mail"></span></p>

        <p><b>I tuoi diritti.</b> Puoi chiedere accesso, rettifica, cancellazione, opposizione, limitazione e portabilità scrivendoci, e proporre reclamo all\'autorità garante del tuo Paese.</p>`,
  t_co:'Politica sui cookie',
  c_co:`<p>Questo sito <b>non installa cookie pubblicitari né di analisi propri</b>. Le tue preferenze (lingua, valuta, tema, preferiti, checklist) sono salvate nell\'archiviazione locale del browser, non in cookie, e non lasciano il tuo dispositivo.</p>

const idiomas = { es:'🇪🇸 Español', en:'🇬🇧 English', de:'🇩🇪 Deutsch', fr:'🇫🇷 Français', it:'🇮🇹 Italiano' };
const lee = (k, d) => { try { return JSON.parse(localStorage.getItem('voyara_' + k)) ?? d; } catch { return d; } };

let idioma = new URLSearchParams(location.search).get('lang') || lee('idioma', null) || (navigator.language || 'es').slice(0,2);
if (!L[idioma]) idioma = 'es';
let tema = lee('tema', 'claro');

function pintar() {
  const l = L[idioma];
  document.documentElement.lang = idioma;
  document.title = CFG.marca + ' — ' + l.titulo;
  document.getElementById('tituloPagina').textContent = l.titulo;
  document.getElementById('actualizado').textContent = l.act + ': ' + new Date().toISOString().slice(0,10);
  document.querySelectorAll('[data-l]').forEach(e => {
    const v = l[e.dataset.l];
    if (e.dataset.l.startsWith('c_')) e.innerHTML = v; else e.textContent = v;
  });
  document.querySelectorAll('.mail').forEach(e => {
    e.innerHTML = '<a href="mailto:' + CFG.email + '">' + CFG.email + '</a>';
  });
  document.querySelectorAll('.logo span:last-child').forEach(e => e.textContent = CFG.marca);
}

document.documentElement.dataset.tema = tema;
document.getElementById('btnTema').textContent = tema === 'oscuro' ? '☀️' : '🌙';
document.getElementById('btnTema').onclick = () => {
  tema = tema === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.dataset.tema = tema;
  document.getElementById('btnTema').textContent = tema === 'oscuro' ? '☀️' : '🌙';
  localStorage.setItem('voyara_tema', JSON.stringify(tema));
};

const sel = document.getElementById('selIdioma');
sel.innerHTML = Object.entries(idiomas).map(([k,v]) => `<option value="${k}" ${k===idioma?'selected':''}>${v}</option>`).join('');
sel.onchange = e => { idioma = e.target.value; localStorage.setItem('voyara_idioma', JSON.stringify(idioma)); pintar(); };

pintar();
</script>
</body>
</html>
